# Agentic Development Environments, rendered at /agentic-dev-envs.
#
# Schema: src/content.config.ts (validated at build time).
# category: who draws the window, and who draws the agent's interface.
#   "ui": a native, web or mobile app with its own agent interface (chat,
#     diffs), even if it also embeds terminals.
#   "agent-terminal": a native app that runs each agent's own CLI in a real
#     terminal pane, adding persistent sessions and agent status.
#   "tui": runs inside the terminal you already use (TUIs, tmux-based tools).
# tech: language(s) then UI layer only, from TECH in src/utils/ades.ts.
# features: see FEATURES in src/utils/ades.ts.
# agents: at most ~8 named; the rest counted in agents_more (total = the
#   count on references.agents, the page listing supported agents).
# release_tag_prefix: only for monorepos whose GitHub "latest" release is a
#   side package (CLI, mobile); limits latest_release to tags with this prefix.
# release_repo: read latest_release from this repo instead of `repo`.
# stars / stars_updated_at / latest_release / last_commit / archived: written
#   by `pnpm ades:update`, don't edit by hand.

