# Harness Bench: Terminal-Bench 4 results, rendered at /harness-bench.
#
# Generated from the harness-bench README's consolidated TB4 task tables
# (main):
# https://github.com/ahstn/harness-bench/blob/main/README.md
# Model: deepseek/deepseek-v4.1-flash via OpenRouter, high reasoning.
# The README's PiG and Empryo rows are left out. Hermes's 2026.9.24 date
# tag is written as 0.21.5, the release it names, so it sorts before 0.21.7.
#
# One row per exact harness version. When a version ran in more than one
# cohort, the README keeps the newest completed cohort's best attempt.
# Per result:
#   score         best attempt's fractional score, as a percentage
#   attempts      accepted attempts that ran (fewer than three when a full
#                 score or official pass stopped the pair early); passes
#                 counts official passes
#   best_attempt  the attempt the row reports; can exceed attempts when a
#                 continuation replaced an excluded attempt
#   cached_tokens, total_tokens, price
#                 null when the selected attempt has no captured metric
#   lower_bound   token and price totals are lower bounds (README's ≥)
#   escaped       a full score or pass skipped the pair's remaining
#                 attempts (‡)
#   price         estimated USD at the cohort's captured reference rates
#                 (these differ between cohorts; see the README)

