# Harness Bench: Terminal-Bench 4 results, rendered at /harness-bench.
#
# Hand-curated from the harness-bench README (feat/resuming-tb4-evals):
# https://github.com/ahstn/harness-bench/blob/feat/resuming-tb4-evals/README.md
# Model: deepseek/deepseek-v4.1-flash via OpenRouter, high reasoning.
# Only the five main harnesses are kept; the README's PiG and Empryo rows
# are left out. Each harness has a row per version it ran.
#
# Per task, one run per cohort that ran it:
#   cohort   the README block the rows come from, plus its date and report
#   method   best-of-3 (the pair's best attempt) | mean-of-3 (mean of
#            the attempts that ran)
# Per result:
#   score         fractional score as a percentage
#   score_sd      sample standard deviation (mean-of-3 only)
#   attempts      attempts that ran (fewer than three when a full score or
#                 official pass stopped the pair early); passes counts
#                 official passes
#   best_attempt  the attempt the row reports (best-of-3 only)
#   lower_bound   token and price totals are lower bounds (README's ≥)
#   escaped       a full score or pass skipped the pair's remaining
#                 attempts (‡)
#   price         estimated USD at the cohort's captured reference rates
#                 (these differ between cohorts; see each report)

